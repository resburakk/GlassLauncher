name: Fetch font (one-off)
on:
  push:
    branches: [claude/build]
    paths: [".github/workflows/fetch-font.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Download Inter (SIL OFL 1.1)
        run: |
          mkdir out && cd out
          curl -fsSL -o inter.ttf "https://raw.githubusercontent.com/google/fonts/main/ofl/inter/Inter%5Bopsz%2Cwght%5D.ttf"
          curl -fsSL -o OFL.txt "https://raw.githubusercontent.com/google/fonts/main/ofl/inter/OFL.txt"
          ls -la
      - name: Push to assets-font branch
        run: |
          cd out
          git init -q -b assets-font
          git config user.name ci; git config user.email ci@users.noreply.github.com
          git add . && git commit -qm "Inter font"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" assets-font
