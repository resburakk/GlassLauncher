name: Build APK
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - name: Build debug APK
        run: |
          set -o pipefail
          gradle assembleDebug --console=plain 2>&1 | tee build.log
      - name: Report errors as annotations
        if: failure()
        run: |
          grep -E "^e: |^w: .*(error)" build.log | head -45 | while IFS= read -r line; do
            echo "::error::${line//$'%'/%25}"
          done
          awk '/What went wrong/{f=1} f{print} /Try:/{exit}' build.log | head -20 | tr '\n' ' ' | sed 's/^/::error::/' ; echo
      - uses: actions/upload-artifact@v4
        with:
          name: GlassLauncher-debug
          path: app/build/outputs/apk/debug/*.apk
