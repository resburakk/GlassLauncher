name: Emulator smoke test
on:
  push:
    branches: [claude/build]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - name: Build release APK
        run: gradle assembleRelease --console=plain
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run on emulator (API 35)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: ./scripts/smoke.sh app/build/outputs/apk/release/app-release.apk
      - name: Publish screenshots to ci-screens branch
        if: always()
        run: |
          [ -d shots ] || exit 0
          git config user.name "ci"; git config user.email "ci@users.noreply.github.com"
          mkdir -p /tmp/s && cp shots/*.png /tmp/s/ || exit 0
          cp shots/*.txt /tmp/s/ 2>/dev/null || true
          git checkout --orphan ci-screens
          git rm -rfq . || true
          cp /tmp/s/*.png .
          cp /tmp/s/*.txt . 2>/dev/null || true
          echo "$GITHUB_SHA" > SHA.txt
          git add *.png *.txt
          git commit -qm "Emülatör ekran görüntüleri ${GITHUB_SHA::7}"
          git push -f origin ci-screens
